name: Deploy

# Deploy runs on every push to main, which covers:
#   - direct pushes to main
#   - merges of pull requests into main (merge commits / squash / rebase)
on:
  push:
    branches: [main]

permissions:
  id-token: write # required for AWS OIDC federation
  contents: read

jobs:
  deploy:
    name: Deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::346425562059:role/github-actions-develo-web
          aws-region: eu-west-1

      - name: Deploy
        run: |
          export REGION=eu-west-1
          export BUCKET_NAME=develo-web-eu-west-1
          export DOMAIN_NAMES="develo.software www.develo.software"
          export CERTIFICATE_ARN=arn:aws:acm:us-east-1:346425562059:certificate/8c743979-c36f-4609-8094-0979cae18fda
          ./deploy.sh
