name: debug-token
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Dump OIDC token claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== github.token (JWT) raw length: $(echo -n "$GITHUB_TOKEN" | wc -c)"
          TOKEN="${{ github.token }}"
          # split header.payload.signature
          IFS='.' read -r H P S <<< "$TOKEN"
          b64pad() { local s="$1"; s="${s//-/_}"; s="${s//+/\/}"; case $(( ${#s} % 4 )) in 2) s="${s}==";; 3) s="${s}=";; esac; echo "$s"; }
          echo "=== HEADER ==="
          echo "$(b64pad "$H")" | base64 -d 2>/dev/null; echo
          echo "=== PAYLOAD (claims) ==="
          echo "$(b64pad "$P")" | base64 -d 2>/dev/null | python3 -m json.tool
          echo "=== SIGNATURE length: $(echo -n "$S" | wc -c)"
